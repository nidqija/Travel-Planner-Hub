<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 830" width="100%" height="100%">
  <defs>
    <style>
      .box { fill: #ffffff; stroke: #333333; stroke-width: 1.5; }
      .circle { fill: #ffffff; stroke: #333333; stroke-width: 1.5; }
      .diamond { fill: #ffffff; stroke: #333333; stroke-width: 1.5; }
      .label-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; font-weight: 500; fill: #111827; text-anchor: middle; }
      .bold-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 14px; font-weight: 600; fill: #111827; text-anchor: middle; }
      .branch-tag { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; font-weight: 600; fill: #4b5563; }
      .footer-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 18px; font-weight: 600; fill: #1f2937; text-anchor: middle; }
      .line { stroke: #333333; stroke-width: 1.5; fill: none; }
      .arrow { fill: #333333; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" class="arrow" />
    </marker>
  </defs>

  <rect width="950" height="780" fill="#ffffff" />

  <!-- Top Loop Back: No branch from Decision to User scrolls feed -->
  <!-- Decision right is at x=830, y=125. Loop goes x=830 -> 880 -> y=45 -> x=205 -> y=85 -->
  <path d="M 830 125 L 880 125 L 880 45 L 205 45 L 205 80" class="line" marker-end="url(#arrow)" />
  <text x="840" y="115" class="branch-tag">No</text>

  <!-- Start Circle -->
  <circle cx="55" cy="125" r="38" class="circle" />
  <text x="55" y="130" class="bold-text">Start</text>
  <line x1="93" y1="125" x2="135" y2="125" class="line" marker-end="url(#arrow)" />

  <!-- Box 1: User scrolls feed -->
  <rect x="140" y="85" width="130" height="80" class="box" />
  <text x="205" y="130" class="label-text">User scrolls feed</text>
  <line x1="270" y1="125" x2="305" y2="125" class="line" marker-end="url(#arrow)" />

  <!-- Box 2: AI-recommendation places displayed -->
  <rect x="310" y="85" width="140" height="80" class="box" />
  <text x="380" y="122" class="label-text">AI-recommendation</text>
  <text x="380" y="140" class="label-text">places displayed</text>
  <line x1="450" y1="125" x2="485" y2="125" class="line" marker-end="url(#arrow)" />

  <!-- Box 3: User tap AI-Contextual View -->
  <rect x="490" y="85" width="140" height="80" class="box" />
  <text x="560" y="122" class="label-text">User tap AI-Contextual</text>
  <text x="560" y="140" class="label-text">View</text>
  <line x1="630" y1="125" x2="665" y2="125" class="line" marker-end="url(#arrow)" />

  <!-- Box 4: Travel time, optimal visiting time, hotel recommendation displayed -->
  <rect x="670" y="85" width="150" height="80" class="box" />
  <text x="745" y="112" class="label-text" font-size="11.5">Travel time, optimal</text>
  <text x="745" y="128" class="label-text" font-size="11.5">visiting time, hotel</text>
  <text x="745" y="144" class="label-text" font-size="11.5">recommendation displayed</text>
  <line x1="745" y1="165" x2="745" y2="185" class="line" marker-end="url(#arrow)" />

  <!-- Diamond Decision: User wants to book? -->
  <polygon points="745,190 830,235 745,280 660,235" class="diamond" />
  <text x="745" y="230" class="label-text">User wants to</text>
  <text x="745" y="248" class="label-text">book?</text>

  <!-- Connectors: Decision to Yes path -->
  <!-- Out left from diamond at x=660, y=235 -> down to x=560 -->
  <path d="M 660 235 L 560 235 L 560 305" class="line" marker-end="url(#arrow)" />
  <text x="635" y="225" class="branch-tag">Yes</text>

  <!-- Vertical Sequence (Center aligned around x=560) -->

  <!-- Box 5: User input dates and amount of people -->
  <rect x="470" y="310" width="180" height="70" class="box" />
  <text x="560" y="342" class="label-text">User input dates and</text>
  <text x="560" y="360" class="label-text">amount of people</text>
  <line x1="560" y1="380" x2="560" y2="405" class="line" marker-end="url(#arrow)" />

  <!-- Box 6: User proceeds and input necessary documentations -->
  <rect x="470" y="410" width="180" height="70" class="box" />
  <text x="560" y="442" class="label-text">User proceeds and input</text>
  <text x="560" y="460" class="label-text">necessary documentations</text>
  <line x1="560" y1="480" x2="560" y2="505" class="line" marker-end="url(#arrow)" />

  <!-- Box 7: Booking confirmed -->
  <rect x="470" y="510" width="180" height="65" class="box" />
  <text x="560" y="548" class="label-text">Booking confirmed</text>
  <line x1="560" y1="575" x2="560" y2="600" class="line" marker-end="url(#arrow)" />

  <!-- Box 8: User views bookings detail -->
  <rect x="470" y="605" width="180" height="65" class="box" />
  <text x="560" y="643" class="label-text">User views bookings detail</text>
  <line x1="560" y1="670" x2="560" y2="695" class="line" marker-end="url(#arrow)" />

  <!-- End Circle -->
  <circle cx="560" cy="735" r="35" class="circle" />
  <text x="560" y="740" class="bold-text">End</text>

  <!-- Title at bottom -->
  <text x="475" y="805" class="footer-title">2.2.2 User Flow Diagram</text>
</svg>
