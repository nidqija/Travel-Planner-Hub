<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="100%" height="100%">
  <defs>
    <style>
      .box { fill: #ffffff; stroke: #333333; stroke-width: 1.5; }
      .title-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 15px; font-weight: 500; fill: #111827; text-anchor: middle; }
      .center-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 15px; font-weight: 600; fill: #111827; text-anchor: middle; }
      .level-tag { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 14px; font-weight: 600; fill: #4b5563; }
      .footer-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 18px; font-weight: 600; fill: #1f2937; text-anchor: middle; }
      .line { stroke: #333333; stroke-width: 1.5; fill: none; }
      .arrow { fill: #333333; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" class="arrow" />
    </marker>
  </defs>

  <rect width="1000" height="560" fill="#ffffff" />

  <!-- Side Labels -->
  <text x="920" y="70" class="level-tag">Effects</text>
  <text x="920" y="245" class="level-tag">Causes</text>
  <text x="920" y="420" class="level-tag">Problem</text>

  <!-- Top Tier: Effects -->
  <!-- Box 1 -->
  <rect x="100" y="20" width="220" height="90" class="box" />
  <text x="210" y="60" class="title-text">Lose track of total spend without</text>
  <text x="210" y="80" class="title-text">budget tracking</text>

  <!-- Box 2 -->
  <rect x="385" y="20" width="230" height="90" class="box" />
  <text x="500" y="55" class="title-text">Passport / ID details and budget</text>
  <text x="500" y="75" class="title-text">tracking are scattered across</text>
  <text x="500" y="95" class="title-text">multiple app</text>

  <!-- Box 3 -->
  <rect x="670" y="20" width="230" height="90" class="box" />
  <text x="785" y="60" class="title-text">Manually sharing sensitive IDs</text>
  <text x="785" y="80" class="title-text">across unsecure Whatsapp chats</text>

  <!-- Middle Tier: Causes -->
  <rect x="385" y="205" width="230" height="85" class="box" />
  <text x="500" y="242" class="center-text">Friction-Heavy Group Travel</text>
  <text x="500" y="264" class="center-text">Planning</text>

  <!-- Bottom Tier: Problem -->
  <!-- Box 1 -->
  <rect x="10" y="380" width="225" height="85" class="box" />
  <text x="122" y="418" class="title-text">Social media doesn't properly</text>
  <text x="122" y="438" class="title-text">display geo-data and pricing</text>

  <!-- Box 2 -->
  <rect x="255" y="380" width="225" height="85" class="box" />
  <text x="367" y="418" class="title-text">Group plans stall due to tedious</text>
  <text x="367" y="438" class="title-text">booking steps</text>

  <!-- Box 3 -->
  <rect x="500" y="380" width="225" height="85" class="box" />
  <text x="612" y="418" class="title-text">Shared cost and budget limit</text>
  <text x="612" y="438" class="title-text">needs to be tracked manually</text>

  <!-- Box 4 -->
  <rect x="745" y="380" width="230" height="85" class="box" />
  <text x="860" y="418" class="title-text">Travel discussion without proper</text>
  <text x="860" y="438" class="title-text">knowledge and well-crafted plan</text>

  <!-- Connectors: Causes to Effects -->
  <!-- Middle Box top center to horizontal bus -->
  <line x1="500" y1="205" x2="500" y2="160" class="line" />
  <line x1="210" y1="160" x2="785" y2="160" class="line" />
  <!-- Bus to Box 1 -->
  <line x1="210" y1="160" x2="210" y2="115" class="line" marker-end="url(#arrow)" />
  <!-- Bus to Box 2 -->
  <line x1="500" y1="160" x2="500" y2="115" class="line" marker-end="url(#arrow)" />
  <!-- Bus to Box 3 -->
  <line x1="785" y1="160" x2="785" y2="115" class="line" marker-end="url(#arrow)" />

  <!-- Connectors: Problem to Causes -->
  <!-- Boxes to bottom bus -->
  <line x1="122" y1="380" x2="122" y2="335" class="line" />
  <line x1="367" y1="380" x2="367" y2="335" class="line" />
  <line x1="612" y1="380" x2="612" y2="335" class="line" />
  <line x1="860" y1="380" x2="860" y2="335" class="line" />
  <line x1="122" y1="335" x2="860" y2="335" class="line" />
  <!-- Bottom bus to Causes -->
  <line x1="500" y1="335" x2="500" y2="295" class="line" marker-end="url(#arrow)" />

  <!-- Diagram Title -->
  <text x="500" y="525" class="footer-text">2.2.1 Problem Tree Graphs</text>
</svg>
